<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול משלוחים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mute:#5d6b85;--line:#dde3ee;--acc:#14213d;--onacc:#fff;--hi:#ffc300;--ok:#1b8a5a;--warn:#c76a00;--bad:#c62828;--tint:#eef2fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--ink:#eef1f8;--mute:#9aa7c2;--line:#2a3555;--acc:#ffc300;--onacc:#14213d;--hi:#ffc300;--ok:#4cc38a;--warn:#ffa940;--bad:#ff6b6b;--tint:#1d2845}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#eef1f8;--mute:#9aa7c2;--line:#2a3555;--acc:#ffc300;--onacc:#14213d;--hi:#ffc300;--ok:#4cc38a;--warn:#ffa940;--bad:#ff6b6b;--tint:#1d2845}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Heebo,system-ui,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:4px 0 12px}
h1{font-size:22px;margin:0;font-weight:800}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--onacc)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:right;font:inherit;color:inherit;cursor:pointer}
.tile b{display:block;font-size:26px;line-height:1.1;font-weight:800}
.tile span{font-size:13px;color:var(--mute)}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile.bad b{color:var(--bad)}
.bar{display:flex;gap:8px;margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--acc);color:var(--onacc)}
.btn.sec{background:var(--tint);color:var(--ink)}
.btn.big{width:100%;padding:14px;font-size:17px}
.btn.del{background:none;color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;border-inline-start:6px solid var(--line)}
.card.ok{border-inline-start-color:var(--ok)}.card.warn{border-inline-start-color:var(--warn)}.card.bad{border-inline-start-color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:18px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.tag{font-size:12px;font-weight:700;background:var(--tint);border-radius:8px;padding:2px 8px}
.tag.ret{background:var(--hi);color:#14213d}
.timer{font-size:13px;font-weight:700;white-space:nowrap}
.timer.ok{color:var(--ok)}.timer.warn{color:var(--warn)}.timer.bad{color:var(--bad)}
.row{margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .t{color:var(--mute);margin-inline-end:4px}
a.lnk{display:inline-block;text-decoration:none;font-size:14px;font-weight:700;background:var(--tint);color:var(--ink);padding:6px 10px;border-radius:9px}
.note{background:var(--tint);border-radius:9px;padding:6px 10px;font-size:14px}
.acts{display:flex;gap:8px;margin-top:8px;align-items:center}
.acts select{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:32px 8px}
.sub{color:var(--mute);font-size:14px;margin:12px 0 6px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,select.f,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;background:var(--tint);padding:10px;border-radius:10px;margin-top:10px}
.chk input{width:20px;height:20px}
details.hist{margin-top:8px;font-size:13px;color:var(--mute)}details.hist summary{cursor:pointer;font-weight:700}details.hist ul{margin:6px 0 0;padding-inline-start:18px}details.hist li{margin:3px 0}.by{opacity:.8}
.thumbb{border:0;padding:0;background:none;cursor:pointer}.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line)}
.pbtn{border:0;font-family:inherit;display:inline-block;margin:0;font-size:14px;font-weight:700;background:var(--tint);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
.full{width:100%;border-radius:12px;display:block;margin:8px 0}
.local{background:var(--hi);color:#14213d;border-radius:10px;padding:6px 10px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>משלוחים</h1>
    <button class="btn sec" id="logout" style="display:none">התנתקות</button>
    <div class="seg" role="tablist"><button id="vOffice" role="tab">משרד</button><button id="vCourier" role="tab">שליח</button></div>
  </header>
  <div id="app"></div>
</div>
<input type="file" accept="image/*" id="photoIn" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0"><input type="file" accept="image/*" capture="environment" id="photoCam" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0">
<div id="modal"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var T={regular:"רגיל",double:"כפול",pickup:"איסוף",express:"מהיר",carton:"קרטון",cod:"גוביינה"};
var RET=["double","pickup","cod"];
var S={new:"חדש",picked:"נאסף",enroute:"בדרך ללקוח",done:"בוצע",returning:"בדרך חזרה למשרד",returned:"חזר למשרד"};
var ACT={picked:"נאסף",enroute:"יצאתי ללקוח",done:"נמסר",returning:"בדרך חזרה למשרד",returned:"הגעתי למשרד"};
var LIMIT=5;               // ימי עסקים ליעד
var WORKDAYS=[0,1,2,3,4];  // ראשון עד חמישי

var DEFAULT_TPL="שלום {שם}, כאן שליח המשלוחים. החבילה שלך (מספר {מספר}) בדרך אליך. נא להיות זמינים בטלפון.";
var parcels=[], view="office", filter="active", db=null, localMode=false, tpl=DEFAULT_TPL;
var canOffice=true;
function fmt(t){return new Date(t).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}
function getLog(p){return p.log&&p.log.length?p.log:[{t:p.createdAt,x:"נוצר"}].concat(p.doneAt?[{t:p.doneAt,x:"סטטוס: בוצע"}]:[])}
function addLog(r,x){r.log=getLog(r).concat([{t:Date.now(),x:x,b:(canOffice&&view==="office")?"משרד":"שליח"}])}
function histHtml(p){var l=getLog(p),last=l[l.length-1];
  return '<details class="hist"><summary>נוצר '+fmt(p.createdAt)+' · עדכון אחרון '+fmt(last.t)+'</summary><ul>'+l.slice().reverse().map(function(e){return '<li><b>'+fmt(e.t)+'</b> '+esc(e.x)+(e.b?' <span class="by">('+esc(e.b)+')</span>':'')+'</li>'}).join("")+'</ul></details>'}
function setCourierNote(id,v){
  var p=parcels.find(function(x){return x.id===id});v=v.trim();
  if(!p||(p.courierNote||"")===v)return;
  p.courierNote=v;addLog(p,v?"הערת שליח: "+v.slice(0,60):"הערת שליח נמחקה");
  if(db){db.collection("parcels").doc(id).update({courierNote:v,log:p.log}).catch(function(){})}else lsSave();
  toast("ההערה נשמרה");
}
function msgFor(p){return tpl.replace(/\{שם\}/g,p.name||"").replace(/\{מספר\}/g,p.number||"")}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function flow(p){return RET.indexOf(p.type)>-1?["new","picked","enroute","done","returning","returned"]:["new","picked","enroute","done"]}
function isFinal(p){var f=flow(p);return p.status===f[f.length-1]}
function isStopped(p){return flow(p).indexOf(p.status)>=3}
function nextStatus(p){var f=flow(p),i=f.indexOf(p.status);return i>-1&&i<f.length-1?f[i+1]:null}

function bizElapsed(from,to){
  var a=new Date(from);a.setHours(0,0,0,0);var b=new Date(to);b.setHours(0,0,0,0);
  var n=0;while(a<b){a.setDate(a.getDate()+1);if(WORKDAYS.indexOf(a.getDay())>-1)n++}
  return n;
}
function timer(p){
  var el=bizElapsed(p.createdAt,isStopped(p)?(p.doneAt||Date.now()):Date.now());
  if(isStopped(p))return {cls:el>LIMIT?"bad":"ok",txt:"נמסר תוך "+el+" ימי עסקים",left:99};
  var left=LIMIT-el;
  if(left<0)return {cls:"bad",txt:"באיחור "+(-left)+" ימי עסקים",left:left};
  if(left===0)return {cls:"warn",txt:"היום היום האחרון",left:0};
  return {cls:left===1?"warn":"ok",txt:"נותרו "+left+" ימי עסקים (יום "+(el+1)+" מתוך "+LIMIT+")",left:left};
}

function phoneIntl(ph){var d=String(ph||"").replace(/\D/g,"");if(d.indexOf("972")===0)return d;if(d.charAt(0)==="0")d=d.slice(1);return "972"+d}
function links(p){
  var h="";
  if(p.address){var q=encodeURIComponent(p.address);
    h+='<div class="row"><span class="t">ניווט</span><a class="lnk" target="_blank" rel="noopener" href="https://waze.com/ul?q='+q+'&navigate=yes">Waze</a><a class="lnk" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+q+'">Google Maps</a></div>';}
  if(p.phone){var ph=esc(p.phone.replace(/[^\d+]/g,"")),mt=encodeURIComponent(msgFor(p));
    h+='<div class="row"><span class="t">'+esc(p.phone)+'</span><a class="lnk" target="_blank" rel="noopener" data-fb="tel" data-pid="'+p.id+'" href="tel:'+ph+'">חיוג</a><a class="lnk" target="_blank" rel="noopener" href="https://wa.me/'+phoneIntl(p.phone)+'?text='+mt+'">וואטסאפ</a><a class="lnk" target="_blank" rel="noopener" data-fb="sms" data-pid="'+p.id+'" href="sms:'+ph+'?&body='+mt+'">SMS</a></div>';}
  return h;
}

function card(p,role){
  var t=timer(p),nx=nextStatus(p);
  var h='<div class="card '+t.cls+'"><div class="top"><div><div class="name">'+esc(p.name)+'</div>';
  h+='<div class="tags"><span class="tag">#'+esc(p.number||"—")+'</span><span class="tag">'+T[p.type]+'</span>'+(RET.indexOf(p.type)>-1?'<span class="tag ret">הלוך וחזור</span>':'')+'<span class="tag">'+S[p.status]+'</span></div></div>';
  h+='<div class="timer '+t.cls+'">'+t.txt+'</div></div>';
  if(p.address)h+='<div>'+esc(p.address)+'</div>';
  h+=links(p);
  if(p.notes)h+='<div class="note">'+esc(p.notes)+'</div>';
  if(role==="courier")h+='<div class="sub" style="margin:8px 0 4px">הערת שליח</div><textarea rows="2" aria-label="הערת שליח" data-cn="'+p.id+'" placeholder="למשל: אין מענה, הושאר אצל שכן">'+esc(p.courierNote)+'</textarea>';
  else if(p.courierNote)h+='<div class="note"><b>הערת שליח:</b> '+esc(p.courierNote)+'</div>';
  if(flow(p).indexOf(p.status)>=2){
    var okPhoto=typeof p.photo==="string"&&p.photo.indexOf("data:image/jpeg;base64,")===0;
    h+='<div class="row">'+(okPhoto?'<button class="thumbb" data-pv="'+p.id+'" aria-label="הצגת צילום מסירה"><img class="thumb" alt="צילום מסירה" src="'+p.photo+'"></button>':'')+'<button class="pbtn" data-pick="'+p.id+'">'+(okPhoto?'החלפת תמונה':'📷 הוספת צילום מסירה (לא חובה)')+'</button></div>';
  }
  h+='<div class="acts">';
  if(nx)h+='<button class="btn" data-next="'+p.id+'">'+ACT[nx]+'</button>';
  if(role==="office"){
    h+='<select aria-label="סטטוס" data-st="'+p.id+'">'+Object.keys(S).filter(function(k){return flow(p).indexOf(k)>-1}).map(function(k){return '<option value="'+k+'"'+(k===p.status?' selected':'')+'>'+S[k]+'</option>'}).join("")+'</select>';
    h+='<button class="btn sec" data-edit="'+p.id+'">עריכה</button>';
  }
  return h+'</div>'+histHtml(p)+'</div>';
}

function sortActive(a,b){return timer(a).left-timer(b).left}

function render(){
  if(needLogin){showLogin();return}
  if(!canOffice)view="courier";
  document.querySelector(".seg").style.display=canOffice?"":"none";
  document.getElementById("vOffice").className=view==="office"?"on":"";
  document.getElementById("vCourier").className=view==="courier"?"on":"";
  var app=document.getElementById("app"),h="";
  if(localMode)h+='<div class="local">מצב מקומי: הנתונים נשמרים במכשיר הזה בלבד ולא משותפים בין משרד לשליח.</div>';
  var active=parcels.filter(function(p){return !isFinal(p)}).sort(sortActive);
  if(view==="office"){
    var late=active.filter(function(p){return timer(p).left<0}).length;
    var cnt=function(s){return parcels.filter(function(p){return p.status===s}).length};
    var tiles=[["active","פעילים",active.length],["late","באיחור",late],["new","חדשים",cnt("new")],["picked","נאספו",cnt("picked")],["enroute","בדרך ללקוח",cnt("enroute")],["returning","בדרך חזרה",cnt("returning")]];
    h+='<div class="tiles">'+tiles.map(function(x){return '<button class="tile'+(filter===x[0]?' on':'')+(x[0]==="late"&&x[2]?' bad':'')+'" data-f="'+x[0]+'"><b>'+x[2]+'</b><span>'+x[1]+'</span></button>'}).join("")+'</div>';
    h+='<div class="bar"><button class="btn" id="add" style="flex:1">+ משלוח חדש</button><button class="btn sec" id="msgset">הודעה</button><button class="btn sec" data-f="done">בוצעו</button><button class="btn sec" data-f="all">הכל</button></div>';
    var list;
    if(filter==="active")list=active;
    else if(filter==="late")list=active.filter(function(p){return timer(p).left<0});
    else if(filter==="done")list=parcels.filter(function(p){return isFinal(p)});
    else if(filter==="all")list=parcels.slice().sort(sortActive);
    else list=parcels.filter(function(p){return p.status===filter}).sort(sortActive);
    h+=list.length?list.map(function(p){return card(p,"office")}).join(""):'<div class="empty">אין משלוחים להצגה. לחץ על &quot;משלוח חדש&quot; כדי להתחיל.</div>';
  }else{
    var groups=[["picked","בדרך אליי: צריך לאסוף"],["enroute","בדרך ללקוח"],["returning","בדרך חזרה למשרד"]];
    var fresh=active.filter(function(p){return p.status==="new"});
    var shown=fresh.length;
    if(fresh.length)h+='<div class="sub">חדשים לאיסוף ('+fresh.length+')</div>'+fresh.map(function(p){return card(p,"courier")}).join("");
    [["picked","נאספו, מוכנים ליציאה"],["enroute","בדרך ללקוח"],["done","נמסרו, ממתינים לחזרה"],["returning","בדרך חזרה למשרד"]].forEach(function(g){
      var l=active.filter(function(p){return p.status===g[0]});
      if(l.length){shown+=l.length;h+='<div class="sub">'+g[1]+' ('+l.length+')</div>'+l.map(function(p){return card(p,"courier")}).join("")}
    });
    if(!shown)h+='<div class="empty">אין משלוחים פעילים. הכל נקי.</div>';
  }
  app.innerHTML=h;
}

function openForm(id){
  var p=id?parcels.find(function(x){return x.id===id}):{type:"regular"};
  var m=document.getElementById("modal");
  m.innerHTML='<div class="modal" id="ov"><div class="sheet" role="dialog" aria-label="משלוח"><h2 style="margin:0 0 4px">'+(id?"עריכת משלוח":"משלוח חדש")+'</h2>'
  +'<label for="fName">שם</label><input id="fName" value="'+esc(p.name)+'">'
  +'<label for="fAddr">כתובת</label><input id="fAddr" value="'+esc(p.address)+'" placeholder="רחוב, מספר, עיר">'
  +'<label for="fPhone">טלפון</label><input id="fPhone" type="tel" inputmode="tel" value="'+esc(p.phone)+'">'
  +'<label for="fNum">מספר חבילה</label><input id="fNum" value="'+esc(p.number)+'">'
  +'<label for="fType">סוג משלוח</label><select class="f" id="fType">'+Object.keys(T).map(function(k){return '<option value="'+k+'"'+(k===p.type?' selected':'')+'>'+T[k]+(RET.indexOf(k)>-1?' (הלוך וחזור)':'')+'</option>'}).join("")+'</select>'
  +'<label for="fNotes">הערות</label><textarea id="fNotes" rows="2">'+esc(p.notes)+'</textarea>'
  +'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="save" style="flex:1">שמירה</button><button class="btn sec" id="cancel">ביטול</button></div>'
  +(id?'<div style="margin-top:8px"><button class="btn del" id="del">מחיקת משלוח</button></div>':'')
  +'</div></div>';
  document.getElementById("cancel").onclick=closeForm;
  document.getElementById("ov").onclick=function(e){if(e.target.id==="ov")closeForm()};
  document.getElementById("save").onclick=function(){
    var name=document.getElementById("fName").value.trim();
    if(!name){document.getElementById("fName").focus();return}
    var before=id?[p.name,p.address,p.phone,p.number,p.type,p.notes].join("|"):"";
    var rec=id?Object.assign({},p):{id:"p"+Date.now(),status:"new",createdAt:Date.now()};
    rec.name=name;rec.address=document.getElementById("fAddr").value.trim();rec.phone=document.getElementById("fPhone").value.trim();
    rec.number=document.getElementById("fNum").value.trim();rec.type=document.getElementById("fType").value;rec.notes=document.getElementById("fNotes").value.trim();
    if(flow(rec).indexOf(rec.status)<0)rec.status="done";
    if(!id)rec.log=[{t:rec.createdAt,x:"נוצר",b:"משרד"}];
    else if(before!==[rec.name,rec.address,rec.phone,rec.number,rec.type,rec.notes].join("|"))addLog(rec,"פרטי המשלוח עודכנו");
    save(rec);closeForm();
  };
  if(id)document.getElementById("del").onclick=function(){if(!this.dataset.sure){this.dataset.sure=1;this.textContent="לחץ שוב לאישור מחיקה";return}remove(id);closeForm()};
  document.getElementById("fName").focus();
}
function closeForm(){document.getElementById("modal").innerHTML=""}

function openMsg(){
  var m=document.getElementById("modal");
  m.innerHTML='<div class="modal" id="ov"><div class="sheet" role="dialog" aria-label="הודעה ללקוח"><h2 style="margin:0 0 4px">הודעה ללקוח</h2><p style="color:var(--mute);margin:0">ההודעה נשלחת בלחיצה על וואטסאפ או SMS. אפשר להשתמש ב-{שם} וב-{מספר} והם יוחלפו בפרטי המשלוח.</p><label for="tplText">נוסח ההודעה</label><textarea id="tplText" rows="5">'+esc(tpl)+'</textarea><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="tplSave" style="flex:1">שמירה</button><button class="btn sec" id="tplReset">שחזור ברירת מחדל</button><button class="btn sec" id="cancel">ביטול</button></div></div></div>';
  document.getElementById("cancel").onclick=closeForm;
  document.getElementById("ov").onclick=function(e){if(e.target.id==="ov")closeForm()};
  document.getElementById("tplReset").onclick=function(){document.getElementById("tplText").value=DEFAULT_TPL};
  document.getElementById("tplSave").onclick=function(){
    var v=document.getElementById("tplText").value.trim()||DEFAULT_TPL;
    tpl=v;
    if(db){db.collection("settings").doc("msg").set({text:v}).catch(function(){})}else{try{localStorage.setItem("tpl",v)}catch(e){}}
    closeForm();render();
  };
}

function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();
    im.onload=function(){
      var mx=900,d;
      for(var tries=0;tries<4;tries++){
        var s=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        var q=.7;d=c.toDataURL("image/jpeg",q);
        while(d.length>170000&&q>.35){q-=.1;d=c.toDataURL("image/jpeg",q)}
        if(d.length<=170000)break;
        mx=Math.round(mx*.75);
      }
      if(d.length>200000){toast("התמונה גדולה מדי. נסה לצלם שוב.");return}
      cb(d);
    };
    im.onerror=function(){toast("לא ניתן לקרוא את התמונה")};
    im.src=r.result};
  r.readAsDataURL(file);
}
function openPick(id){
  var m=document.getElementById("modal");
  m.innerHTML='<div class="modal" id="ov"><div class="sheet" role="dialog" aria-label="צילום מסירה"><h2 style="margin:0 0 12px">צילום מסירה</h2><div style="display:grid;gap:8px"><button class="btn big" id="pickCam">📷 צילום במצלמה</button><button class="btn big sec" id="pickGal">🖼️ בחירה מהגלריה</button><button class="btn big sec" id="cancel">ביטול</button></div></div></div>';
  document.getElementById("cancel").onclick=closeForm;
  document.getElementById("ov").onclick=function(e){if(e.target.id==="ov")closeForm()};
  function go(inp){window.pickId=id;var fi=document.getElementById(inp);fi.value="";fi.click();closeForm()}
  document.getElementById("pickCam").onclick=function(){go("photoCam")};
  document.getElementById("pickGal").onclick=function(){go("photoIn")};
}
function toast(m){var d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-weight:700";document.body.appendChild(d);setTimeout(function(){d.remove()},3000)}
function setPhoto(id,data){
  var p=parcels.find(function(x){return x.id===id});if(!p)return;
  var r=Object.assign({},p);if(data)r.photo=data;else delete r.photo;addLog(r,data?(p.photo?"תמונת מסירה הוחלפה":"נוספה תמונת מסירה"):"תמונת מסירה נמחקה");
  if(db&&!data){db.collection("parcels").doc(id).set(r).catch(function(){});parcels=parcels.map(function(x){return x.id===id?r:x});render()}else save(r);
}
function openPhoto(id){
  var p=parcels.find(function(x){return x.id===id});if(!p||typeof p.photo!=="string"||p.photo.indexOf("data:image/jpeg;base64,")!==0)return;
  var m=document.getElementById("modal");
  m.innerHTML='<div class="modal" id="ov"><div class="sheet" role="dialog" aria-label="צילום מסירה"><h2 style="margin:0">צילום מסירה: '+esc(p.name)+'</h2><img class="full" alt="צילום מסירה" src="'+p.photo+'"><div style="display:flex;gap:8px"><button class="btn" id="cancel" style="flex:1">סגירה</button><button class="btn del" id="pdel">מחיקת תמונה</button></div></div></div>';
  document.getElementById("cancel").onclick=closeForm;
  document.getElementById("ov").onclick=function(e){if(e.target.id==="ov")closeForm()};
  document.getElementById("pdel").onclick=function(){if(!this.dataset.sure){this.dataset.sure=1;this.textContent="לחץ שוב לאישור מחיקה";return}setPhoto(id,null);closeForm()};
}

function setStatus(id,st){
  var p=parcels.find(function(x){return x.id===id});if(!p||p.status===st)return;
  var r=Object.assign({},p);r.status=st;addLog(r,"סטטוס: "+S[st]);
  var idx=flow(r).indexOf(st);
  if(idx>=3){if(!r.doneAt)r.doneAt=Date.now()}else{delete r.doneAt}
  save(r);
}

function save(rec){
  var i=parcels.findIndex(function(x){return x.id===rec.id});
  if(i>-1)parcels[i]=rec;else parcels.push(rec);
  render();
  if(db){db.collection("parcels").doc(rec.id).set(rec).catch(function(){})}
  else lsSave();
}
function remove(id){
  parcels=parcels.filter(function(x){return x.id!==id});render();
  if(db){db.collection("parcels").doc(id).delete().catch(function(){})}else lsSave();
}
function lsSave(){try{localStorage.setItem("parcels",JSON.stringify(parcels))}catch(e){}}
function lsLoad(){try{parcels=JSON.parse(localStorage.getItem("parcels")||"[]")}catch(e){parcels=[]}}

document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.id==="vOffice"||t.id==="vCourier"){view=t.id==="vOffice"?"office":"courier";try{localStorage.setItem("view",view)}catch(x){}render();return}
  if(t.id==="logout"){if(auth)auth.signOut();return}
  if(t.id==="add"){openForm();return}
  if(t.id==="msgset"){openMsg();return}
  if(t.dataset.pv){openPhoto(t.dataset.pv);return}
  if(t.dataset.pick){openPick(t.dataset.pick);return}
  if(t.dataset.f){filter=t.dataset.f;render();return}
  if(t.dataset.edit){openForm(t.dataset.edit);return}
  if(t.dataset.next){var p=parcels.find(function(x){return x.id===t.dataset.next});if(p)setStatus(p.id,nextStatus(p))}
});
document.addEventListener("change",function(e){
  var d=e.target.dataset;if(!d)return;
  if(d.st)setStatus(d.st,e.target.value);
  if(d.cn)setCourierNote(d.cn,e.target.value);
  if((e.target.id==="photoIn"||e.target.id==="photoCam")&&e.target.files&&e.target.files[0]&&window.pickId){var id=window.pickId;toast("מעבד תמונה...");shrink(e.target.files[0],function(url){setPhoto(id,url);toast("התמונה נשמרה")})}
});

function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("הועתק")},function(){legacyCopy(t)});return}}catch(e){}
  legacyCopy(t);
}
function legacyCopy(t){
  var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;top:0;opacity:0";document.body.appendChild(a);a.focus();a.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  a.remove();toast(ok?"הועתק":"לא הצלחתי להעתיק, בחר את הטקסט ידנית");
}
function openContact(kind,pid){
  var p=parcels.find(function(x){return x.id===pid});if(!p)return;
  var m=document.getElementById("modal");
  m.innerHTML='<div class="modal" id="ov"><div class="sheet" role="dialog" aria-label="פרטי קשר"><h2 style="margin:0 0 4px">'+(kind==="tel"?"חיוג אל ":"SMS אל ")+esc(p.name)+'</h2><p style="color:var(--mute);margin:0 0 8px">הדפדפן חסם פתיחה אוטומטית. העתק את המספר והדבק באפליקציית הטלפון.</p><div dir="ltr" style="font-size:28px;font-weight:800;text-align:center;padding:10px;background:var(--tint);border-radius:12px;user-select:all">'+esc(p.phone)+'</div><button class="btn big" id="cpNum" style="margin-top:8px">העתקת מספר</button>'
  +(kind==="sms"?'<label>הודעה</label><div class="note" style="user-select:all">'+esc(msgFor(p))+'</div><button class="btn big sec" id="cpMsg" style="margin-top:8px">העתקת ההודעה</button>':'')
  +'<button class="btn big sec" id="cancel" style="margin-top:8px">סגירה</button></div></div>';
  document.getElementById("cancel").onclick=closeForm;
  document.getElementById("ov").onclick=function(e){if(e.target.id==="ov")closeForm()};
  document.getElementById("cpNum").onclick=function(){copyText(p.phone.replace(/[^\d+]/g,""))};
  if(kind==="sms")document.getElementById("cpMsg").onclick=function(){copyText(msgFor(p))};
}
document.addEventListener("click",function(e){
  var a=e.target.closest&&e.target.closest("a[data-fb]");if(!a)return;
  var left=false,mark=function(){left=true};
  window.addEventListener("blur",mark,{once:true});document.addEventListener("visibilitychange",mark,{once:true});
  var kind=a.dataset.fb,pid=a.dataset.pid;
  setTimeout(function(){if(!left)openContact(kind,pid)},900);
});
try{var tt=localStorage.getItem("tpl");if(tt)tpl=tt}catch(e){}
try{var v=localStorage.getItem("view");if(v==="courier"||v==="office")view=v}catch(e){}
render();

// ===== הגדרות Firebase: להחליף בערכים מהפרויקט שלך =====
var FIREBASE_CONFIG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT",appId:"YOUR_APP_ID"};
var OFFICE_EMAILS=["office@example.com"]; // כתובות המייל של המשרד (חייב להתאים ל-firestore.rules)
// =====================================================
var needLogin=false,auth=null;
function showLogin(msg){
  document.querySelector(".seg").style.display="none";
  document.getElementById("app").innerHTML='<div class="card" style="max-width:380px;margin:24px auto"><h2 style="margin:0 0 4px">התחברות</h2><label for="lgEmail">אימייל</label><input id="lgEmail" type="email" autocomplete="username" inputmode="email"><label for="lgPass">סיסמה</label><input id="lgPass" type="password" autocomplete="current-password"><div id="lgErr" style="color:var(--bad);font-weight:700;min-height:22px;margin-top:6px">'+esc(msg||"")+'</div><button class="btn big" id="lgGo">כניסה</button></div>';
  var go=function(){
    var em=document.getElementById("lgEmail").value.trim(),pw=document.getElementById("lgPass").value;
    document.getElementById("lgErr").textContent="";
    auth.signInWithEmailAndPassword(em,pw).catch(function(){document.getElementById("lgErr").textContent="אימייל או סיסמה שגויים"});
  };
  document.getElementById("lgGo").onclick=go;
  document.getElementById("lgPass").onkeydown=function(e){if(e.key==="Enter")go()};
}
(function(){
  if(FIREBASE_CONFIG.apiKey==="YOUR_API_KEY"||typeof firebase==="undefined"){localMode=true;lsLoad();render();return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();var fs=firebase.firestore();
  var unsubP=null,unsubS=null,offices=OFFICE_EMAILS.map(function(x){return x.toLowerCase()});
  auth.onAuthStateChanged(function(u){
    if(unsubP){unsubP();unsubP=null}if(unsubS){unsubS();unsubS=null}
    if(!u){db=null;needLogin=true;parcels=[];document.getElementById("logout").style.display="none";render();return}
    needLogin=false;db=fs;localMode=false;
    canOffice=offices.indexOf((u.email||"").toLowerCase())>-1;
    if(!canOffice)view="courier";
    document.getElementById("logout").style.display="";
    unsubS=db.collection("settings").doc("msg").onSnapshot(function(s){var x=s.exists&&s.data();if(x&&typeof x.text==="string"&&x.text){tpl=x.text;if(!document.getElementById("modal").innerHTML)render()}},function(){});
    unsubP=db.collection("parcels").onSnapshot(function(snap){
      parcels=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x});
      if(!document.getElementById("modal").innerHTML&&!(document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.cn))render();
    },function(){toast("אין הרשאה לקרוא נתונים")});
    render();
  });
})();
setInterval(function(){if(!document.getElementById("modal").innerHTML)render()},3600000);
</script>
