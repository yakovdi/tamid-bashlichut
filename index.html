<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול משלוחים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mute:#5d6b85;--line:#dde3ee;--acc:#14213d;--onacc:#fff;--hi:#ffc300;--ok:#1b8a5a;--warn:#c76a00;--bad:#c62828;--tint:#eef2fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--ink:#eef1f8;--mute:#9aa7c2;--line:#2a3555;--acc:#ffc300;--onacc:#14213d;--hi:#ffc300;--ok:#4cc38a;--warn:#ffa940;--bad:#ff6b6b;--tint:#1d2845}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#eef1f8;--mute:#9aa7c2;--line:#2a3555;--acc:#ffc300;--onacc:#14213d;--hi:#ffc300;--ok:#4cc38a;--warn:#ffa940;--bad:#ff6b6b;--tint:#1d2845}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Heebo,system-ui,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:4px 0 12px}
h1{font-size:22px;margin:0;font-weight:800}
.seg{display:flex;background:var(--tint);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:8px 16px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--onacc)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:right;font:inherit;color:inherit;cursor:pointer}
.tile b{display:block;font-size:26px;line-height:1.1;font-weight:800}
.tile span{font-size:13px;color:var(--mute)}
.tile.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile.bad b{color:var(--bad)}
.bar{display:flex;gap:8px;margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--acc);color:var(--onacc)}
.btn.sec{background:var(--tint);color:var(--ink)}
.btn.big{width:100%;padding:14px;font-size:17px}
.btn.del{background:none;color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;border-inline-start:6px solid var(--line)}
.card.ok{border-inline-start-color:var(--ok)}.card.warn{border-inline-start-color:var(--warn)}.card.bad{border-inline-start-color:var(--bad)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:18px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.tag{font-size:12px;font-weight:700;background:var(--tint);border-radius:8px;padding:2px 8px}
.tag.bad{background:var(--bad);color:#fff}.tag.ret{background:var(--hi);color:#14213d}
.timer{font-size:13px;font-weight:700;white-space:nowrap}
.timer.ok{color:var(--ok)}.timer.warn{color:var(--warn)}.timer.bad{color:var(--bad)}
.row{margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .t{color:var(--mute);margin-inline-end:4px}
a.lnk{display:inline-block;text-decoration:none;font-size:14px;font-weight:700;background:var(--tint);color:var(--ink);padding:6px 10px;border-radius:9px}
.note{background:var(--tint);border-radius:9px;padding:6px 10px;font-size:14px}
.acts{display:flex;gap:8px;margin-top:8px;align-items:center}
.acts select{flex:1;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:32px 8px}
.sub{color:var(--mute);font-size:14px;margin:12px 0 6px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,select.f,textarea{width:100%;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;background:var(--tint);padding:10px;border-radius:10px;margin-top:10px}
.chk input{width:20px;height:20px}
details.hist{margin-top:8px;font-size:13px;color:var(--mute)}details.hist summary{cursor:pointer;font-weight:700}details.hist ul{margin:6px 0 0;padding-inline-start:18px}details.hist li{margin:3px 0}.by{opacity:.8}
.thumbb{border:0;padding:0;background:none;cursor:pointer}.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line)}
.pbtn{border:0;font-family:inherit;display:inline-block;margin:0;font-size:14px;font-weight:700;background:var(--tint);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
.full{width:100%;border-radius:12px;display:block;margin:8px 0}
.addrl{position:absolute;z-index:25;inset-inline:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.25)}.addrl button{display:block;width:100%;text-align:start;border:0;background:none;color:var(--ink);font:inherit;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.sum div{background:var(--tint);border-radius:12px;padding:10px;text-align:center}.sum b{display:block;font-size:20px}.sum span{font-size:12px;color:var(--mute)}
.local{background:var(--hi);color:#14213d;border-radius:10px;padding:6px 10px;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>משלוחים <span style="font-size:12px;color:var(--mute);font-weight:500">v<span id="verNum"></span></span></h1>
    <button class="btn sec" id="logout" style="display:none">התנתקות</button>
    <div class="seg" role="tablist"><button id="vOffice" role="tab">משרד</button><button id="vCourier" role="tab">שליח</button></div>
  </header>
  <div id="qWrap" style="margin:0 0 10px"><input id="q" type="search" placeholder="🔍 חיפוש לפי שם, כתובת, טלפון, מספר חבילה, הערות..." aria-label="חיפוש"></div>
  <div id="app"></div>
</div>
<input type="file" accept="image/*" id="photoIn" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0"><input type="file" accept="image/*" capture="environment" id="photoCam" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0">
<div id="modal"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var APP_VERSION="1.3.0";
var CHANGELOG=[["1.3.0","סטטוס ביטול וסטטוס כשל במסירה עם סיבה, חלון וואטסאפ אוטומטי ללקוח בשינוי סטטוס, הודעות ניתנות לעריכה, קישור איתור אישי"],["1.2.0","חיפוש לפי כל השדות, דף איתור חבילה ללקוחות (מספר חבילה וטלפון), תפקידים: אדמין, משרד ושליח"],["1.1.0","מחירון לפי סוג, כספים ותשלומים לשליח, חיפוש כתובת בגוגל, איסוף חזור בלבד, מספר גרסה"],["1.0.0","גרסה ראשונה: משלוחים, סטטוסים, טיימר, היסטוריה, צילום, הודעות"]];
var GOOGLE_KEY="";
var TRACK_URL="https://yakovdi.github.io/tamid-bashlichut/track.html";
var query="";
var T={regular:"רגיל",double:"כפול",pickup:"איסוף",express:"מהיר",carton:"קרטון",cod:"גוביינה"};
var RET=["double","pickup","cod"];
var S={new:"חדש",picked:"נאסף",enroute:"בדרך ללקוח",done:"בוצע",returning:"בדרך חזרה למשרד",returned:"חזר למשרד",failed:"כשל במסירה",cancelled:"בוטל"};
var ACT={picked:"נאסף",enroute:"יצאתי ללקוח",done:"נמסר",returning:"בדרך חזרה למשרד",returned:"הגעתי למשרד"};
var LIMIT=5;               // ימי עסקים ליעד
var WORKDAYS=[0,1,2,3,4];  // ראשון עד חמישי

var DEFAULT_TPL="שלום {שם}, כאן שליח המשלוחים. החבילה שלך (מספר {מספר}) בדרך אליך. נא להיות זמינים בטלפון.";
var DEFAULT_PRICES={regular:0,double:0,pickup:0,express:0,carton:0,cod:0},prices=Object.assign({},DEFAULT_PRICES),payments=[],canAdmin=true;
var parcels=[], view="office", filter="active", db=null, localMode=false, tpl=DEFAULT_TPL;
var canOffice=true;
function fmt(t){return new Date(t).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}
function getLog(p){return p.log&&p.log.length?p.log:[{t:p.createdAt,x:"נוצר"}].concat(p.doneAt?[{t:p.doneAt,x:"סטטוס: בוצע"}]:[])}
function addLog(r,x){r.log=getLog(r).concat([{t:Date.now(),x:x,b:(canOffice&&view==="office")?"משרד":"שליח"}])}
function histHtml(p){var l=getLog(p),last=l[l.length-1];
  return '<details class="hist"><summary>נוצר '+fmt(p.createdAt)+' · עדכון אחרון '+fmt(last.t)+'</summary><ul>'+l.slice().reverse().map(function(e){return '<li><b>'+fmt(e.t)+'</b> '+esc(e.x)+(e.b?' <span class="by">('+esc(e.b)+')</span>':'')+'</li>'}).join("")+'</ul></details>'}
function setCourierNote(id,v){
  var p=parcels.find(function(x){return x.id===id});v=v.trim();
  if(!p||(p.courierNote||"")===v)return;
  p.courierNote=v;addLog(p,v?"הערת שליח: "+v.slice(0,60):"הערת שליח נמחקה");
  if(db){db.collection("parcels").doc(id).update({courierNote:v,log:p.log}).catch(function(){})}else lsSave();
  toast("ההערה נשמרה");
}
var AUTO_DEF={
 pickup:"שלום, נפתחה בקשת איסוף ממך מס' {מספר} על ידי דיאטת לורן , בימים הקרובים שליח יתאם איתך את מועד האיסוף. יש לוודא כי החבילה ארוזה היטב וסגורה בצורה הרמטית",
 picked:"שלום {שם} , ההזמנה שלך מדיאטת לורן שמספרה {מספר} התקבלה אצלנו במחסנים ותצא להפצה בימים הקרובים. למעקב אחר המשלוח בכל רגע נתון: {קישור}",
 enroute:"שלום {שם}, חבילה {מספר} מדיאטת לורן תגיע היום ל{כתובת}. להשארה ליד הדלת — השב 1 + קוד כניסה/קומה/דירה. לתיקון כתובת — השב 3 + כתובת חדשה. (ייתכן ושינוי עיר / רחוב במעמד זה ידחה את ההפצה למועד אחר) מעקב: {קישור}",
 done:"היי {שם}, משלוח {מספר} מדיאטת לורן נמסר הרגע ל{כתובת}."};
var AUTO=Object.assign({},AUTO_DEF);
var FAIL_REASONS=["אין מענה","כתובת שגויה","נדחה על ידי הלקוח למועד אחר","אחר (פירוט חופשי)"];
function trackLink(p){return TRACK_URL?TRACK_URL+"?n="+encodeURIComponent(p.number||"")+"&p="+encodeURIComponent(normPhone(p.phone)):""}
function fillTpl(t,p){return t.replace(/\{שם\}/g,p.name||"").replace(/\{מספר\}/g,p.number||"").replace(/\{כתובת\}/g,p.address||"").replace(/\{קישור\}/g,trackLink(p))}
function msgFor(p){return fillTpl(tpl,p)}
function applyMsgDoc(x){
  if(typeof x.text==="string"&&x.text)tpl=x.text;
  Object.keys(AUTO_DEF).forEach(function(k){var v=x["a_"+k];if(typeof v==="string"&&v)AUTO[k]=v});
}
function waKind(p,st){
  if(p.type==="pickup")return null;
  return {picked:"picked",enroute:"enroute",done:"done"}[st]||null;
}
function openWa(pid,kind){
  var p=parcels.find(function(x){return x.id===pid});if(!p||!p.phone||!AUTO[kind])return;
  var text=fillTpl(AUTO[kind],p);
  var m=document.getElementById("modal");
  m.innerHTML='<div class="modal" id="ov"><div class="sheet" role="dialog" aria-label="הודעה ללקוח"><h2 style="margin:0 0 8px">שליחת הודעה ללקוח</h2><div class="note" style="white-space:pre-wrap">'+esc(text)+'</div><a class="btn big" id="waGo" style="display:block;text-align:center;text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="https://wa.me/'+phoneIntl(p.phone)+'?text='+encodeURIComponent(text)+'">שליחה בוואטסאפ ל'+esc(p.name)+'</a><button class="btn big sec" id="cancel" style="margin-top:8px">דילוג</button></div></div>';
  document.getElementById("cancel").onclick=closeForm;
  document.getElementById("ov").onclick=function(e){if(e.target.id==="ov")closeForm()};
  document.getElementById("waGo").onclick=function(){setTimeout(closeForm,400)};
}
function openFail(pid){
  var p=parcels.find(function(x){return x.id===pid});if(!p)return;
  var m=document.getElementById("modal");
  m.innerHTML='<div class="modal" id="ov"><div class="sheet" role="dialog" aria-label="כשל במסירה"><h2 style="margin:0 0 8px">כשל במסירה: '+esc(p.name)+'</h2>'
  +FAIL_REASONS.map(function(r,i){return '<label class="chk"><input type="radio" name="fr" value="'+i+'"'+(i===0?' checked':'')+'>'+(i+1)+'. '+esc(r)+'</label>'}).join("")
  +'<label for="frNote">פירוט (חובה בסיבה האחרונה)</label><input id="frNote">'
  +'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="frOk" style="flex:1">שמירת כשל</button><button class="btn sec" id="cancel">חזרה</button></div></div></div>';
  document.getElementById("cancel").onclick=closeForm;
  document.getElementById("ov").onclick=function(e){if(e.target.id==="ov")closeForm()};
  document.getElementById("frOk").onclick=function(){
    var i=parseInt(m.querySelector('input[name="fr"]:checked').value,10),note=document.getElementById("frNote").value.trim();
    if(i===FAIL_REASONS.length-1&&!note){document.getElementById("frNote").focus();return}
    var reason=(i===FAIL_REASONS.length-1?"":FAIL_REASONS[i])+(note?(i===FAIL_REASONS.length-1?"":": ")+note:"");
    setStatus(pid,"failed",reason);closeForm();
  };
}
function openCancel(pid){
  var p=parcels.find(function(x){return x.id===pid});if(!p)return;
  var m=document.getElementById("modal");
  m.innerHTML='<div class="modal" id="ov"><div class="sheet" role="dialog" aria-label="ביטול משלוח"><h2 style="margin:0 0 8px">ביטול משלוח: '+esc(p.name)+'</h2><p style="color:var(--mute);margin:0">המשלוח יסומן כמבוטל ולא יחושב בכספים.</p><label for="cnNote">סיבת ביטול (לא חובה)</label><input id="cnNote"><div style="display:flex;gap:8px;margin-top:14px"><button class="btn del" id="cnOk" style="flex:1;background:var(--bad);color:#fff">ביטול משלוח</button><button class="btn sec" id="cancel">חזרה</button></div></div></div>';
  document.getElementById("cancel").onclick=closeForm;
  document.getElementById("ov").onclick=function(e){if(e.target.id==="ov")closeForm()};
  document.getElementById("cnOk").onclick=function(){setStatus(pid,"cancelled",document.getElementById("cnNote").value.trim());closeForm()};
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function flow(p){if(p.type==="pickup")return ["new","enroute","done","returning","returned"];return RET.indexOf(p.type)>-1?["new","picked","enroute","done","returning","returned"]:["new","picked","enroute","done"]}
function isFinal(p){var f=flow(p);return p.status===f[f.length-1]||p.status==="cancelled"}
function isStopped(p){return ["done","returning","returned"].indexOf(p.status)>-1}
function SL(p,st){return p.type==="pickup"&&st==="done"?"נאסף מהלקוח":S[st]}
function ACTL(p,st){if(p.status==="failed"&&st==="enroute")return "ניסיון חוזר: יצאתי ללקוח";return p.type==="pickup"&&st==="done"?"נאסף מהלקוח":ACT[st]}
function typeLabel(k){return k==="pickup"?"איסוף (חזור בלבד)":T[k]+(RET.indexOf(k)>-1?" (הלוך וחזור)":"")}
function priceOf(p){return p.price!=null?p.price:(prices[p.type]||0)}
function fm(n){return "₪"+(Math.round(n*100)/100).toLocaleString("he-IL")}
function nextStatus(p){if(p.status==="failed")return "enroute";var f=flow(p),i=f.indexOf(p.status);return i>-1&&i<f.length-1?f[i+1]:null}

function bizElapsed(from,to){
  var a=new Date(from);a.setHours(0,0,0,0);var b=new Date(to);b.setHours(0,0,0,0);
  var n=0;while(a<b){a.setDate(a.getDate()+1);if(WORKDAYS.indexOf(a.getDay())>-1)n++}
  return n;
}
function timer(p){
  if(p.status==="cancelled")return {cls:"",txt:"בוטל",left:99};
  var el=bizElapsed(p.createdAt,isStopped(p)?(p.doneAt||Date.now()):Date.now());
  if(isStopped(p))return {cls:el>LIMIT?"bad":"ok",txt:"נמסר תוך "+el+" ימי עסקים",left:99};
  var left=LIMIT-el;
  if(left<0)return {cls:"bad",txt:"באיחור "+(-left)+" ימי עסקים",left:left};
  if(left===0)return {cls:"warn",txt:"היום היום האחרון",left:0};
  return {cls:left===1?"warn":"ok",txt:"נותרו "+left+" ימי עסקים (יום "+(el+1)+" מתוך "+LIMIT+")",left:left};
}

function phoneIntl(ph){var d=String(ph||"").replace(/\D/g,"");if(d.indexOf("972")===0)return d;if(d.charAt(0)==="0")d=d.slice(1);return "972"+d}
function links(p){
  var h="";
  if(p.address){var q=encodeURIComponent(p.address);
    h+='<div class="row"><span class="t">ניווט</span><a class="lnk" target="_blank" rel="noopener" href="https://waze.com/ul?q='+q+'&navigate=yes">Waze</a><a class="lnk" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+q+'">Google Maps</a></div>';}
  if(p.phone){var ph=esc(p.phone.replace(/[^\d+]/g,"")),mt=encodeURIComponent(msgFor(p));
    h+='<div class="row"><span class="t">'+esc(p.phone)+'</span><a class="lnk" target="_blank" rel="noopener" data-fb="tel" data-pid="'+p.id+'" href="tel:'+ph+'">חיוג</a><a class="lnk" target="_blank" rel="noopener" href="https://wa.me/'+phoneIntl(p.phone)+'?text='+mt+'">וואטסאפ</a><a class="lnk" target="_blank" rel="noopener" data-fb="sms" data-pid="'+p.id+'" href="sms:'+ph+'?&body='+mt+'">SMS</a></div>';}
  return h;
}

function card(p,role){
  var t=timer(p),nx=nextStatus(p);
  var h='<div class="card '+t.cls+'"><div class="top"><div><div class="name">'+esc(p.name)+'</div>';

function sortActive(a,b){return timer(a).left-timer(b).left}

    h+='<div class="bar"><button class="btn" id="add" style="flex:1">+ משלוח חדש</button><button class="btn sec" id="msgset">הודעה</button><button class="btn sec" data-f="done">בוצעו</button><button class="btn sec" data-f="all">הכל</button></div>'+(canAdmin?'<div class="bar"><button class="btn sec" id="finbtn" style="flex:1">💰 כספים</button><button class="btn sec" id="setbtn" style="flex:1">⚙ הגדרות</button></div>':'');

    else if(filter==="done")list=parcels.filter(function(p){return isFinal(p)});
    else if(filter==="all")list=parcels.slice().sort(sortActive);
    else list=parcels.filter(function(p){return p.status===filter}).sort(sortActive);
    h+=list.length?list.map(function(p){return card(p,"office")}).join(""):'<div class="empty">אין משלוחים להצגה. לחץ על &quot;משלוח חדש&quot; כדי להתחיל.</div>';
  }else if(query.trim()){
    var ql=parcels.filter(function(p){return matches(p,query.trim())}).sort(function(a,b){return b.createdAt-a.createdAt});
    h+='<div class="sub">נמצאו '+ql.length+' תוצאות</div>'+ql.map(function(p){return card(p,"courier")}).join("");
  }else{
    var groups=[["picked","בדרך אליי: צריך לאסוף"],["enroute","בדרך ללקוח"],["returning","בדרך חזרה למשרד"]];
    var fresh=active.filter(function(p){return p.status==="new"});
    var shown=fresh.length;
    if(fresh.length)h+='<div class="sub">חדשים לאיסוף ('+fresh.length+')</div>'+fresh.map(function(p){return card(p,"courier")}).join("");
    [["picked","נאספו, מוכנים ליציאה"],["enroute","בדרך ללקוח"],["failed","כשל במסירה: ניסיון חוזר או החזרה"],["done","נמסרו, ממתינים לחזרה"],["returning","בדרך חזרה למשרד"]].forEach(function(g){

    });

  }

function attachPlaces(){
  var inp=document.getElementById("fAddr");if(!GOOGLE_KEY||!inp)return;
  var w=document.createElement("div");w.style.position="relative";inp.parentNode.insertBefore(w,inp);w.appendChild(inp);

  inp.setAttribute("autocomplete","off");
  inp.addEventListener("input",function(){
    clearTimeout(tm);var q=inp.value.trim(),my=++seq;
    if(q.length<3){list.style.display="none";return}
    tm=setTimeout(function(){
      fetch("https://places.googleapis.com/v1/places:autocomplete",{method:"POST",headers:{"Content-Type":"application/json","X-Goog-Api-Key":GOOGLE_KEY},body:JSON.stringify({input:q,languageCode:"he",includedRegionCodes:["il"],sessionToken:tok})})
      .then(function(r){return r.json()}).then(function(d){
        if(my!==seq)return;
        var items=(d.suggestions||[]).filter(function(x){return x.placePrediction}).slice(0,6);
        list.innerHTML="";
        items.forEach(function(x){var t=x.placePrediction.text&&x.placePrediction.text.text;if(!t)return;
          var b=document.createElement("button");b.type="button";b.textContent=t;
          b.onclick=function(){inp.value=t;list.style.display="none"};list.appendChild(b)});
        list.style.display=list.children.length?"block":"none";
      }).catch(function(){});
    },300);
  });
  inp.addEventListener("blur",function(){setTimeout(function(){list.style.display="none"},250)});
}

function shrink(file,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();
    im.onload=function(){
      var mx=900,d;
      for(var tries=0;tries<4;tries++){
        var s=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        var q=.7;d=c.toDataURL("image/jpeg",q);
        while(d.length>170000&&q>.35){q-=.1;d=c.toDataURL("image/jpeg",q)}
        if(d.length<=170000)break;
        mx=Math.round(mx*.75);
      }
      if(d.length>200000){toast("התמונה גדולה מדי. נסה לצלם שוב.");return}
      cb(d);
    };
    im.onerror=function(){toast("לא ניתן לקרוא את התמונה")};
    im.src=r.result};
  r.readAsDataURL(file);
}

function setStatus(id,st,reason){
  var p=parcels.find(function(x){return x.id===id});if(!p||p.status===st)return;

  if(["done","returning","returned"].indexOf(st)>-1){if(!r.doneAt)r.doneAt=Date.now()}else{delete r.doneAt}
  save(r);
}


function normPhone(ph){var d=String(ph||"").replace(/\D/g,"");if(d.indexOf("972")===0)d="0"+d.slice(3);return d}
function matches(p,q){
  var hay=[p.name,p.address,p.phone,normPhone(p.phone),p.number,p.notes,p.courierNote,p.failReason,T[p.type],typeLabel(p.type),SL(p,p.status),canOffice?priceOf(p):""].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(t){return hay.indexOf(t)>-1});
}
function trackKey(p){
  if(!p||!p.number||!p.phone||!window.crypto||!crypto.subtle)return Promise.resolve(null);
  var str=String(p.number).trim().toLowerCase()+"|"+normPhone(p.phone);
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")});
}
var STAGE={new:"new",picked:"picked",enroute:"enroute",done:"done",returning:"done",returned:"done",failed:"failed",cancelled:"cancelled"};
function trackDoc(p){
  var times={new:p.createdAt},rev={};
  Object.keys(S).forEach(function(k){rev[S[k]]=k});rev["נאסף מהלקוח"]="done";
  getLog(p).forEach(function(e){var m=/^סטטוס: ([^(]+?)(?: \(.*\))?$/.exec(e.x);if(m&&rev[m[1]]){var st=STAGE[rev[m[1]]];if(!times[st])times[st]=e.t}});
  return {number:String(p.number).trim(),kind:p.type==="pickup"?"pickup":"delivery",stage:STAGE[p.status]||"new",times:times,updatedAt:Date.now()};
}
function syncTrack(rec,old){
  if(!db)return;
  Promise.all([trackKey(rec),old?trackKey(old):Promise.resolve(null)]).then(function(k){
    if(k[1]&&k[1]!==k[0])db.collection("track").doc(k[1]).delete().catch(function(){});
    if(k[0])db.collection("track").doc(k[0]).set(trackDoc(rec)).catch(function(){});
  }).catch(function(){});
}
function dropTrack(p){if(!db||!p)return;trackKey(p).then(function(k){if(k)db.collection("track").doc(k).delete().catch(function(){})}).catch(function(){})}
function syncAllTrack(){parcels.forEach(function(p){syncTrack(p,null)});toast("סנכרון נשלח ל-"+parcels.length+" משלוחים")}
function save(rec){
  var i=parcels.findIndex(function(x){return x.id===rec.id});
  var oldRec=i>-1?parcels[i]:null;
  if(i>-1)parcels[i]=rec;else parcels.push(rec);
  render();
  if(db){db.collection("parcels").doc(rec.id).set(rec).catch(function(){});syncTrack(rec,oldRec)}
  else lsSave();
}
function remove(id){
  dropTrack(parcels.find(function(x){return x.id===id}));
  parcels=parcels.filter(function(x){return x.id!==id});render();
  if(db){db.collection("parcels").doc(id).delete().catch(function(){})}else lsSave();
}
