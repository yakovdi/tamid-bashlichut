<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#14213d"><title>איתור חבילה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mute:#5d6b85;--line:#dde3ee;--acc:#14213d;--onacc:#fff;--ok:#1b8a5a;--bad:#c62828;--hi:#ffc300}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#172038;--ink:#eef1f8;--mute:#9aa7c2;--line:#2a3555;--acc:#ffc300;--onacc:#14213d;--ok:#4cc38a;--bad:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Heebo,system-ui,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:460px;margin:0 auto;padding:16px}h1{margin:8px 0 4px;font-size:24px;font-weight:800}p{color:var(--mute);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;font-size:17px;background:var(--acc);color:var(--onacc);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.err{color:var(--bad);font-weight:700}.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;position:relative}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);flex:none;margin-top:2px}.step.on .dot{background:var(--ok);border-color:var(--ok)}.step.cur .dot{box-shadow:0 0 0 4px rgba(27,138,90,.25)}
.step b{display:block}.step span{color:var(--mute);font-size:13px}.step.off{opacity:.55}
</style></head><body><div class="wrap">
<h1>איתור חבילה</h1><p>הזינו את מספר החבילה ואת מספר הטלפון שלכם כדי לראות את הסטטוס.</p>
<div class="card"><label for="n">מספר חבילה</label><input id="n" inputmode="text" autocomplete="off"><label for="p">טלפון</label><input id="p" type="tel" inputmode="tel" autocomplete="tel"><button id="go">איתור</button></div>
<div id="out"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var CFG={apiKey:"AIzaSyA0NaX161Zps-lEmAUhXlYgkOkJvdSagO0",authDomain:"tamid-bashlichut.firebaseapp.com",projectId:"tamid-bashlichut",appId:"1:591655933588:web:3e1da334eb8d45c77b4681"};
firebase.initializeApp(CFG);var fs=firebase.firestore();
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function normPhone(ph){var d=String(ph||"").replace(/\D/g,"");if(d.indexOf("972")===0)d="0"+d.slice(3);return d}
function key(n,ph){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(String(n).trim().toLowerCase()+"|"+normPhone(ph))).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join("")})}
function fmt(t){return new Date(t).toLocaleString("he-IL",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}
var FLOW={delivery:[["new","התקבלה במערכת"],["picked","נאספה על ידי השליח"],["enroute","בדרך אליכם"],["done","נמסרה"]],pickup:[["new","התקבלה במערכת"],["enroute","השליח בדרך אליכם"],["done","נאספה"]]};
var out=document.getElementById("out"),last=0;
function show(d){
  var f=FLOW[d.kind]||FLOW.delivery,cur=0,bad=d.stage==="failed"||d.stage==="cancelled";f.forEach(function(x,i){if(x[0]===d.stage)cur=i});
  out.innerHTML='<div class="card"><b>חבילה #'+esc(d.number)+'</b>'+(bad?'<p class="err" style="margin:8px 0 0">'+(d.stage==="failed"?'ניסיון המסירה לא הושלם. ניצור איתכם קשר לתיאום מועד חדש.':'המשלוח בוטל.')+'</p>':'')+'<div style="margin-top:6px">'+f.map(function(x,i){var t=d.times&&d.times[x[0]];
    return '<div class="step '+((bad?!!(d.times&&d.times[x[0]]):i<=cur)?'on':'off')+(!bad&&i===cur?' cur':'')+'"><div class="dot"></div><div><b>'+x[1]+'</b>'+(t&&(bad||i<=cur)?'<span>'+fmt(t)+'</span>':'')+'</div></div>'}).join("")
    +'</div><p style="margin:8px 0 0;font-size:13px">עודכן לאחרונה: '+fmt(d.updatedAt)+'</p></div>';
}
document.getElementById("go").onclick=function(){
  var n=document.getElementById("n").value.trim(),ph=document.getElementById("p").value.trim();
  if(!n||!ph){out.innerHTML='<p class="err" style="margin-top:12px">נא למלא מספר חבילה וטלפון.</p>';return}
  if(Date.now()-last<1500)return;last=Date.now();
  out.innerHTML='<p style="margin-top:12px">מחפש...</p>';
  key(n,ph).then(function(k){return fs.collection("track").doc(k).get()}).then(function(doc){
    if(doc.exists)show(doc.data());else out.innerHTML='<p class="err" style="margin-top:12px">לא נמצאה חבילה. בדקו את מספר החבילה ואת הטלפון.</p>';
  }).catch(function(){out.innerHTML='<p class="err" style="margin-top:12px">אירעה שגיאה. נסו שוב בעוד רגע.</p>'});
};
var qs=new URLSearchParams(location.search);if(qs.get("n")&&qs.get("p")){document.getElementById("n").value=qs.get("n");document.getElementById("p").value=qs.get("p");document.getElementById("go").click()}
</script></body></html>
